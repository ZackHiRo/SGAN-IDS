# Second dataset: CIC-IDS2017 (MachineLearningCVE CSVs), stratified 70/15/15 split.
# Rare classes (augment.classes): Bot, Web Attack.
name: cic_ids2017
output_dir: artifacts
seeds: [0, 1, 2]

data:
  dataset: cic_ids2017
  root: datasets
  val_size: 0.15
  test_size: 0.15
  deduplicate: true
  # BENIGN (2.1M unique flows) and DoS Hulk are capped so that classifiers x methods x seeds
  # stays within a few GPU-pod hours. Every attack class is far below the cap and kept whole.
  max_rows_per_class: 250000
  # The three web attacks share one target server and nearly identical flow statistics,
  # and SQL injection has only 21 flows; they are merged into one class.
  label_map:
    "Web Attack - Brute Force": Web Attack
    "Web Attack - XSS": Web Attack
    "Web Attack - Sql Injection": Web Attack
  # Too few flows to learn a distribution from (or to score fairly): about 7 and 25 training rows.
  drop_classes: [Heartbleed, Infiltration]
  categorical_min_frequency: 0.001

gan:
  # A 40k-step run improved the best validation MMD by only 2-11 % over the best at 20k
  # (seed 0: 0.0371 -> 0.0331; seeds 1-2: 0.0344/0.0346 -> 0.0336), at +1.3 h for 3 seeds. With
  # rare-class F1 already 0.93-0.96 without augmentation, 20k is the better trade-off.
  n_steps: 20000
  batch_size: 512
  eval_every: 1000

augment:
  # The two attack classes under 0.1 % of the original flows once Heartbleed and Infiltration are dropped.
  classes: [Bot, Web Attack]
  target_per_class: 10000
  methods: [none, class_weight, balanced_weight, ros, smote, ctgan, gan]

eval:
  # No MLP here. scikit-learn's MLP runs on CPU; extrapolating from UNSW-NB15 it would take
  # several hours on ~500k training rows (3 seeds x 6 methods). On UNSW-NB15 every
  # oversampling method lowered its rare-class F1 alike, so it adds little to the comparison.
  classifiers: [rf, hgb]
