[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgan-ids"
version = "2.0.0"
description = "Class-conditional WGAN-GP for augmenting rare attack classes in network intrusion detection, evaluated against SMOTE, oversampling and CTGAN."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zakaria Aoun" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "torch>=2.1",
    "imbalanced-learn>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
ctgan = ["ctgan>=0.10"]
tune = ["optuna>=3.5"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
sgan-ids = "sgan_ids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501", "B905"]
